<title>__TITLE__</title>
<style>
  :root {
    --ground: #E8E5DE; --panel: #F1EFE9; --ink: #17201F; --ink-2: #46514E;
    --ink-3: #6E7A76; --rule: #CFCABF; --anchored: #A96A08; --approx: #00846F;
    --bar: #A96A08; --bar-soft: #D8C6A4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #101619; --panel: #161E22; --ink: #E4E7E5; --ink-2: #A9B4B1;
      --ink-3: #7E8A88; --rule: #253034; --anchored: #CB811A; --approx: #2C9C8D;
      --bar: #CB811A; --bar-soft: #3B3527;
    }
  }
  :root[data-theme="dark"] {
    --ground: #101619; --panel: #161E22; --ink: #E4E7E5; --ink-2: #A9B4B1;
    --ink-3: #7E8A88; --rule: #253034; --anchored: #CB811A; --approx: #2C9C8D;
    --bar: #CB811A; --bar-soft: #3B3527;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.55;
    -webkit-font-smoothing: antialiased; }
  .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino,
           "Book Antiqua", Georgia, serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
          font-variant-numeric: tabular-nums; }

  .page { max-width: 1080px; margin: 0 auto; padding: 26px 26px 80px; }
  nav { display: flex; flex-wrap: wrap; gap: 1px; background: var(--rule);
    border: 1px solid var(--rule); margin-bottom: 34px; }
  nav a { flex: 1 1 auto; min-width: 52px; text-align: center; padding: 8px 6px;
    font-size: 12px; text-decoration: none; color: var(--ink-2);
    background: var(--panel); letter-spacing: .04em; }
  nav a:hover { background: var(--ground); color: var(--ink); }
  nav a[aria-current="page"] { background: var(--ink); color: var(--panel); font-weight: 600; }
  nav a:focus-visible { outline: 2px solid var(--anchored); outline-offset: -2px; }

  .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-3); margin: 0 0 10px; }
  h1 { font-size: 38px; line-height: 1.1; margin: 0 0 12px; text-wrap: balance;
    font-weight: 600; letter-spacing: -.015em; }
  h2 { font-size: 21px; margin: 44px 0 12px; font-weight: 600; letter-spacing: -.01em; }
  .lede { color: var(--ink-2); font-size: 16.5px; max-width: 64ch; margin: 0 0 6px; }
  p { max-width: 68ch; }
  a { color: var(--anchored); }

  .years { display: flex; flex-wrap: wrap; gap: 6px; margin: 26px 0 18px; }
  .years button { font: inherit; font-size: 13px; padding: 6px 14px; cursor: pointer;
    background: var(--panel); color: var(--ink-2); border: 1px solid var(--rule);
    border-radius: 2px; }
  .years button:hover { border-color: var(--ink-3); color: var(--ink); }
  .years button[aria-pressed="true"] { background: var(--ink); color: var(--panel);
    border-color: var(--ink); font-weight: 600; }
  .years button:focus-visible { outline: 2px solid var(--anchored); outline-offset: 2px; }

  .chart { display: grid; grid-template-columns: 150px 1fr 64px; gap: 3px 12px;
    align-items: center; margin-top: 8px; }
  .chart .lab { font-size: 13px; text-align: right; color: var(--ink-2); }
  .chart .track { background: var(--bar-soft); height: 17px; border-radius: 0 3px 3px 0; }
  .chart .fill { background: var(--bar); height: 17px; border-radius: 0 3px 3px 0;
    transition: width .25s ease; }
  .chart .val { font-size: 12.5px; color: var(--ink-3);
    font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .chart .fill { transition: none; } }
  @media (max-width: 620px) { .chart { grid-template-columns: 110px 1fr 52px; } }

  table.data { border-collapse: collapse; font-size: 13.5px; margin-top: 10px; width: 100%; }
  table.data th, table.data td { text-align: left; padding: 7px 12px 7px 0;
    border-bottom: 1px solid var(--rule); }
  table.data td.n, table.data th.n { text-align: right;
    font-variant-numeric: tabular-nums; }
  .scroll { overflow-x: auto; }
  table.data th { cursor: pointer; user-select: none; white-space: nowrap; }
  table.data th:hover { color: var(--ink); }
  table.data th[aria-sort]::after { content: " \2193"; font-size: 11px; }
  table.data th[aria-sort="descending"]::after { content: " \2191"; }
  table.data th:focus-visible { outline: 2px solid var(--anchored); outline-offset: -2px; }
  td.bar { position: relative; min-width: 92px; }
  td.bar .bw { position: absolute; left: 0; top: 4px; bottom: 4px;
    background: var(--bar-soft); border-radius: 0 2px 2px 0; z-index: 0; }
  td.bar .bv { position: relative; z-index: 1; padding-right: 2px; }

  figure { margin: 26px 0; }
  figure img { width: 100%; max-width: 100%; height: auto; display: block;
    border: 1px solid var(--rule); background: #fff; }
  figcaption { font-size: 12.5px; color: var(--ink-3); margin-top: 9px; max-width: 68ch; }

  .biblio { border-top: 1px solid var(--rule); padding-top: 20px; margin-top: 30px; }
  .biblio h3 { font-size: 16px; margin: 0 0 4px; font-weight: 600; }
  .biblio .meta { font-size: 13px; color: var(--ink-3); margin: 0 0 6px; }
  .biblio p { font-size: 13.5px; color: var(--ink-2); margin: 0 0 8px; }
  .note { font-size: 13px; color: var(--ink-3); border-left: 2px solid var(--rule);
    padding-left: 14px; margin: 22px 0; }
  .note strong { color: var(--ink-2); font-weight: 600; }

  .map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 24px; margin: 22px 0 8px; }
  .map-card { margin: 0; border: 1px solid var(--rule); background: var(--panel);
    padding: 12px; border-radius: 3px; }
  .map-card img { width: 100%; height: auto; display: block; border: 1px solid var(--rule);
    background: #fff; }
  .map-card h3 { font-size: 14.5px; margin: 10px 0 3px; font-weight: 600;
    letter-spacing: -.005em; }
  .map-card .meta { font-size: 12px; color: var(--ink-3); margin: 0 0 8px; }
  .map-card p { font-size: 13px; color: var(--ink-2); margin: 0 0 8px; max-width: none; }
  .map-card .dl { font-size: 12.5px; margin: 10px 0 0; }
  .map-badge { display: inline-block; font-size: 10.5px; letter-spacing: .04em;
    text-transform: uppercase; padding: 2px 7px; border-radius: 2px; margin: 10px 0 0;
    border: 1px solid var(--rule); color: var(--ink-3); }
  .map-badge.in { color: var(--anchored); border-color: var(--anchored); }
  .map-badge.out { border-style: dashed; }
</style>

<div class="page">
  __NAV__
  <p class="eyebrow">__EYEBROW__</p>
  <h1 class="serif">__H1__</h1>
  <p class="lede">__LEDE__</p>
  __CONTENT__
</div>
__SCRIPT__
